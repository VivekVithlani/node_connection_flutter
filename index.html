<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="description" content="Edit and share https://ringplan.app dialplans." />

    <!-- 🧠 Dynamic base path (auto-detects repo/project folder) -->
    <script>
      (function() {
        const path = window.location.pathname.split('/')[1];
        const base = document.createElement('base');
        base.href = path ? '/' + path + '/' : '/';
        document.head.appendChild(base);
      })();
    </script>

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Visual Dialplan Editor" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Visual Dialplan Editor</title>
    <link rel="manifest" href="manifest.json" />
  </head>

  <body>
    <script async src="flutter_bootstrap.js"></script>
  </body>
</html>
